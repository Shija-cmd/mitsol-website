{% load humanize %}

<div class="card learning-course-card h-100">
    {% if course.cover_image %}
    <img src="{{ course.cover_image.url }}" class="card-img-top" alt="{{ course.title }}">
    {% endif %}

    <div class="card-body d-flex flex-column">
        <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="badge bg-primary">{{ course.level }}</span>
            <span class="badge bg-light text-dark border">{{ course.delivery_mode }}</span>
            <span class="badge {% if course.is_free %}bg-success{% else %}bg-info text-dark{% endif %}">
                {{ course.display_price }}
            </span>
        </div>

        <h3 class="h5 fw-bold">
            {{ course.title }}
        </h3>

        <p class="text-muted flex-grow-1">
            {{ course.short_description|truncatewords:24 }}
        </p>

        <p class="small text-muted mb-3">
            <i class="fas fa-layer-group me-1"></i>
            {{ course.category.name }}
        </p>

        <div class="d-grid gap-2">
            <a href="{% url 'learning:course_detail' course.slug %}" class="btn btn-outline-primary">
                View Course
            </a>
            {% if not course.is_free %}
            <a href="{% url 'learning:enrol' course.slug %}" class="btn btn-primary">
                Enrol and Pay
            </a>
            {% endif %}
        </div>
    </div>
</div>
