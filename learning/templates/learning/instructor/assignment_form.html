{% extends 'core/base.html' %}

{% block content %}
<section class="page-hero centered">
    <div class="container text-center">
        <span class="section-kicker">Instructor</span>
        <h1 class="fw-bold mt-3">{{ title }}</h1>
        <p class="lead">Set assignment instructions, deadline, attempts, and submission rules.</p>
    </div>
</section>

<section class="py-5 bg-light">
    <div class="container">
        <form method="post" class="card border-0 shadow-sm">
            <div class="card-body p-4">
                {% csrf_token %}
                {% include 'core/includes/form_fields.html' %}
                <button type="submit" class="btn btn-primary">Save Assignment</button>
                <a href="{% url 'learning:instructor_assignment_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
