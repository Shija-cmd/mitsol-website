{% extends 'core/base.html' %}

{% block content %}

<section class="page-hero centered">
    <div class="container text-center">
        <span class="section-kicker">Instructor</span>
        <h1 class="fw-bold mt-3">{{ title }}</h1>
        <p class="lead">Prepare professional course information for learners and institutional stakeholders.</p>
    </div>
</section>

<section class="py-5 bg-light">
    <div class="container">
        <form method="post" enctype="multipart/form-data" class="card border-0 shadow-sm">
            <div class="card-body p-4">
                {% csrf_token %}
                {% include 'core/includes/form_fields.html' %}
                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">Save Course</button>
                    <a href="{% url 'learning:instructor_courses' %}" class="btn btn-outline-secondary">Cancel</a>
                    {% if course %}
                    <a href="{% url 'learning:instructor_course_modules' course.pk %}" class="btn btn-outline-primary">Manage Modules</a>
                    {% endif %}
                </div>
            </div>
        </form>
    </div>
</section>

{% endblock %}
