{% extends 'core/base.html' %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <h1 class="fw-bold mb-3">

                    Order {{ product.name }}

                </h1>

                <p class="text-muted">

                    Version {{ product.version }} -
                    {{ product.price }}

                </p>

                <form method="post" class="card shadow-sm">

                    {% csrf_token %}

                    <div class="card-body">

                        {% for field in form %}

                        <div class="mb-3">

                            <label class="form-label" for="{{ field.id_for_label }}">

                                {{ field.label }}

                            </label>

                            {{ field }}

                            {% if field.errors %}

                            <div class="text-danger small mt-1">

                                {{ field.errors|striptags }}

                            </div>

                            {% endif %}

                        </div>

                        {% endfor %}

                        <button type="submit" class="btn btn-primary">

                            Submit Order

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</section>

{% endblock %}
